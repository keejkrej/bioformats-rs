[package]
name = "bioformats-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Embeddable native Rust readers for multidimensional bioimaging formats"

[lib]
name = "bioformats_rs"
path = "src/lib.rs"

[dependencies]
bincode = "1.3"
byteorder = "1.5"
dicom-toolkit-jpeg2000 = { version = "=0.5.0", default-features = false, features = ["std"] }
flate2 = "1.0"
jpeg-decoder = "0.3"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
weezl = "0.1"
zstd = "0.13"

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
bindgen = "0.72"
cc = { version = "1.2", features = ["parallel"] }
